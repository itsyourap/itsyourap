<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" role="img" aria-label="~/github/stats.yaml">
<title>~/github/stats.yaml</title>
<style>
text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; white-space: pre; }
.muted { fill: #8b949e; }
.dim { fill: #4b5563; }
.accent { fill: #22d3ee; }
.accent2 { fill: #a78bfa; }
.ok { fill: #34d399; }
.fade { animation: fadeIn .6s ease-out both; }
.grow { animation: growX .9s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left center; }
.rise { animation: growY .9s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: center bottom; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes ring { from { stroke-dashoffset: 301.59; } } .ring { animation: ring 1.4s cubic-bezier(.2,.8,.2,1) both; }</style>
<defs>
  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="0.5" y="0.5" width="499" height="239" rx="12"/></clipPath>
</defs>
<g clip-path="url(#cardClip)">
  <rect width="500" height="240" fill="#0b0f14"/>
  <rect width="500" height="36" fill="#11161d"/>
  <line x1="0" y1="36" x2="500" y2="36" stroke="#232b36"/>
  <circle cx="20" cy="18.0" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="18.0" r="5.5" fill="#febc2e"/>
  <circle cx="56" cy="18.0" r="5.5" fill="#28c840"/>
  <text x="76" y="22.0" class="mono muted" font-size="12">~/github/stats.yaml</text>
  <text x="482" y="22.0" text-anchor="end" class="mono dim" font-size="11">Ankan Pal</text>
  <g transform="translate(0 36)">
<text x="24" y="30" class="mono" font-size="13"><tspan class="accent">$</tspan> gh stats <tspan class="muted">--user</tspan> itsyourap</text>
<g class="fade" style="animation-delay:0.10s"><text x="24" y="58" class="mono muted" font-size="12.5">stars_earned</text><text x="160" y="58" class="mono dim" font-size="12.5">···········</text><text x="290" y="58" class="mono" font-size="12.5" font-weight="600" text-anchor="end">37</text></g>
<g class="fade" style="animation-delay:0.16s"><text x="24" y="77" class="mono muted" font-size="12.5">contributions_1y</text><text x="160" y="77" class="mono dim" font-size="12.5">···········</text><text x="290" y="77" class="mono" font-size="12.5" font-weight="600" text-anchor="end">4,901</text></g>
<g class="fade" style="animation-delay:0.22s"><text x="24" y="96" class="mono muted" font-size="12.5">contributions_all</text><text x="160" y="96" class="mono dim" font-size="12.5">···········</text><text x="290" y="96" class="mono" font-size="12.5" font-weight="600" text-anchor="end">8,895</text></g>
<g class="fade" style="animation-delay:0.28s"><text x="24" y="115" class="mono muted" font-size="12.5">pull_requests</text><text x="160" y="115" class="mono dim" font-size="12.5">···········</text><text x="290" y="115" class="mono" font-size="12.5" font-weight="600" text-anchor="end">346</text></g>
<g class="fade" style="animation-delay:0.34s"><text x="24" y="134" class="mono muted" font-size="12.5">issues</text><text x="160" y="134" class="mono dim" font-size="12.5">···········</text><text x="290" y="134" class="mono" font-size="12.5" font-weight="600" text-anchor="end">129</text></g>
<g class="fade" style="animation-delay:0.40s"><text x="24" y="153" class="mono muted" font-size="12.5">contributed_to</text><text x="160" y="153" class="mono dim" font-size="12.5">···········</text><text x="290" y="153" class="mono" font-size="12.5" font-weight="600" text-anchor="end">160</text></g>
<g class="fade" style="animation-delay:0.46s"><text x="24" y="172" class="mono muted" font-size="12.5">repositories</text><text x="160" y="172" class="mono dim" font-size="12.5">···········</text><text x="290" y="172" class="mono" font-size="12.5" font-weight="600" text-anchor="end">149</text></g>
<g class="fade" style="animation-delay:0.52s"><text x="24" y="191" class="mono muted" font-size="12.5">followers</text><text x="160" y="191" class="mono dim" font-size="12.5">···········</text><text x="290" y="191" class="mono" font-size="12.5" font-weight="600" text-anchor="end">100</text></g>
<circle cx="400" cy="108" r="48" fill="none" stroke="#1b222c" stroke-width="8"/><circle class="ring" cx="400" cy="108" r="48" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="301.59" stroke-dashoffset="61.39" transform="rotate(-90 400 108)"/><text x="400" y="118" text-anchor="middle" font-size="30" font-weight="700" class="fade" style="animation-delay:0.60s">A</text><text x="400" y="186" text-anchor="middle" class="mono muted" font-size="11">top 20.4%</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="499" height="239" rx="12" fill="none" stroke="#232b36"/>
</svg>
